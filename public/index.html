<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Form</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f3f4f6;
        margin: 0;
        padding: 32px;
      }
      .container {
        max-width: 520px;
        margin: 0 auto;
        background: #fff;
        padding: 24px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }
      h1 {
        margin-top: 0;
      }
      form {
        display: grid;
        gap: 16px;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 8px;
      }
      input, select, button {
        width: 100%;
        padding: 10px 12px;
        font-size: 16px;
        box-sizing: border-box;
      }
      .button-row {
        display: flex;
        gap: 12px;
      }
      button {
        cursor: pointer;
      }
      .status {
        margin-top: 12px;
        padding: 12px;
        border-radius: 8px;
        background: #eef6ff;
        display: none;
      }
      .status.error {
        background: #fff0f0;
        color: #8b1e1e;
      }
      .status.success {
        background: #edf9ee;
        color: #1d5c2f;
      }
      .country-details {
        margin-top: 16px;
        padding: 16px;
        background: #f9fafb;
        border-radius: 8px;
      }
      .error-text {
        color: #b42318;
        font-size: 14px;
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Registration</h1>
      <form id="registrationForm" novalidate>
        <div>
          <label for="firstName">First Name</label>
          <input id="firstName" name="firstName" type="text" />
          <div id="firstNameError" class="error-text"></div>
        </div>

        <div>
          <label for="lastName">Last Name</label>
          <input id="lastName" name="lastName" type="text" />
          <div id="lastNameError" class="error-text"></div>
        </div>

        <div>
          <label for="birthDate">Birthdate</label>
          <input id="birthDate" name="birthDate" type="date" />
          <div id="birthDateError" class="error-text"></div>
        </div>

        <div>
          <label for="countryCode">Country Code</label>
          <select id="countryCode" name="countryCode">
            <option value="">Select a country code</option>
            <option value="RW">RW</option>
            <option value="KE">KE</option>
            <option value="UG">UG</option>
            <option value="DE">DE</option>
            <option value="US">US</option>
            <option value="FR">FR</option>
          </select>
          <div id="countryCodeError" class="error-text"></div>
        </div>

        <div class="button-row">
          <button id="saveButton" type="submit">Save</button>
          <button id="clearButton" type="button">Clear</button>
        </div>
      </form>

      <div id="statusMessage" class="status"></div>

      <div id="countryDetails" class="country-details" aria-live="polite">
        <strong>Country details:</strong>
        <div>Currency code: <span id="currencyCode">-</span></div>
        <div>Population: <span id="population">-</span></div>
        <div>Capital city: <span id="capitalCity">-</span></div>
        <div>HTTP status: <span id="httpStatus">-</span></div>
      </div>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
